<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter</title>
    <link rel="stylesheet" href="counter.css">
</head>
<body>
    <div class="top-icons">
         <button class="icon-btn" title="Info">i</button>
         <a href="setting.html"><button class="icon-btn" id="settingsBtn" title="Settings">⚙</button></a>
         <button class="icon-btn" id="resetBtn" title="Reset">↻</button>
    </div>

    <div id="counter">0</div>

    <button class="plus-btn" id="increaseBtn">+</button>

    <button class="minus-btn" id="decreaseBtn">-</button>

    <script src="index.js" ></script>
</body>
</html>
